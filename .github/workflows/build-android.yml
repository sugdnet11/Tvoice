name: Tvoice Android — Build & Release

on:
  workflow_dispatch:
  push:
    branches: [android]
    tags: ["android-v*"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: >-
          flutter test
          test/api_client_test.dart
          test/models_test.dart
          test/windows_home_shell_test.dart

      - name: Configure production signing
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.TVOICE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TVOICE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: tvoice
          KEY_PASSWORD: ${{ secrets.TVOICE_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvoice-release.jks"
          echo "TVOICE_SIGNING_STORE_FILE=$RUNNER_TEMP/tvoice-release.jks" >> "$GITHUB_ENV"
          echo "TVOICE_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TVOICE_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TVOICE_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build diagnostic APK
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        run: flutter build apk --debug

      - name: Build signed release APK and AAB
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify production signing certificate
        if: startsWith(github.ref, 'refs/tags/android-v')
        shell: bash
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner_path"
          expected="5c7f64ece62ec08aa11cabf2ce51ce0482ef4747d56f4f6193ad62233748b745"
          certificate_output="$("$apksigner_path" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          printf '%s\n' "$certificate_output"
          actual="$(printf '%s\n' "$certificate_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error title=Signing certificate mismatch::Expected $expected but got ${actual:-missing}"
            exit 1
          fi
          echo "Signer certificate SHA-256 verified: $actual"

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(cut -d+ -f1 VERSION)"
          mkdir -p release-output
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            cp build/app/outputs/flutter-apk/app-release.apk "release-output/Tvoice-Android-v${version}.apk"
            cp build/app/outputs/bundle/release/app-release.aab "release-output/Tvoice-Android-v${version}.aab"
          else
            cp build/app/outputs/flutter-apk/app-debug.apk "release-output/Tvoice-Android-v${version}-debug.apk"
          fi
          (cd release-output && sha256sum Tvoice-Android-* > "Tvoice-Android-v${version}-SHA256.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: tvoice-android-${{ github.sha }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tvoice-android-${{ github.sha }}
          path: release-output
      - uses: softprops/action-gh-release@v2
        with:
          name: Tvoice Android 0.17.10
          prerelease: true
          body: |
            Platform branch: android
            Source commit: ${{ github.sha }}
            Tests: flutter analyze + flutter test passed
            Signing: production keystore from GitHub Secrets
            Signing certificate SHA-256: 5c7f64ece62ec08aa11cabf2ce51ce0482ef4747d56f4f6193ad62233748b745
          files: release-output/*
