name: Tvoice Windows — Build & Release

on:
  workflow_dispatch:
  push:
    branches: [windows]
    tags: ["windows-v*"]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            server-backend/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter client
        run: flutter analyze

      - name: Test Flutter client
        run: flutter test

      - name: Typecheck server
        shell: pwsh
        run: |
          pnpm --dir server-backend install --frozen-lockfile
          pnpm --dir server-backend run typecheck

      - name: Test guest web client
        shell: pwsh
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run typecheck
          pnpm --dir web test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Tvoice.iss'

      - name: Prepare checksum
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim().Split('+')[0]
          $setup = "artifacts\Tvoice-Windows-v$version-Setup-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          "$hash  Tvoice-Windows-v$version-Setup-x64.exe" | Set-Content -Encoding ascii "artifacts\Tvoice-Windows-v$version-SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: tvoice-windows-${{ github.sha }}
          path: |
            artifacts/Tvoice-Windows-v*-Setup-x64.exe
            artifacts/Tvoice-Windows-v*-SHA256.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tvoice-windows-${{ github.sha }}
          path: release-output
      - uses: softprops/action-gh-release@v2
        with:
          name: Tvoice Windows 0.17.10
          prerelease: true
          body: |
            Platform branch: windows
            Source commit: ${{ github.sha }}
            Tests: Flutter, server typecheck and guest web tests passed
            Signing: Unsigned build — Windows SmartScreen may show a warning
          files: release-output/*
