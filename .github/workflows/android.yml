name: Android quality and release

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Unit tests, lint and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-quality-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Tvoice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Restore permanent signing key
        env:
          TVOICE_KEYSTORE_BASE64: ${{ secrets.TVOICE_KEYSTORE_BASE64 }}
          TVOICE_KEYSTORE_PASSWORD: ${{ secrets.TVOICE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$TVOICE_KEYSTORE_BASE64" ] || [ -z "$TVOICE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Tvoice signing secrets are missing"
            exit 1
          fi
          printf '%s' "$TVOICE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvoice-release.jks"
      - name: Build signed optimized APK
        env:
          TVOICE_SIGNING_STORE_FILE: ${{ runner.temp }}/tvoice-release.jks
          TVOICE_SIGNING_STORE_PASSWORD: ${{ secrets.TVOICE_KEYSTORE_PASSWORD }}
          TVOICE_SIGNING_KEY_ALIAS: tvoice
          TVOICE_SIGNING_KEY_PASSWORD: ${{ secrets.TVOICE_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Tvoice-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
