org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# These compatibility flags are required by the current Flutter/WebRTC plugins.
android.newDsl=false
android.builtInKotlin=false
# Windows antivirus can temporarily lock large Android/WebRTC and Kotlin cache
# files while compiler workers close them. A single in-process, non-incremental
# compiler keeps release builds deterministic across clean Windows machines.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
