name: TvoiceIOS
options:
  bundleIdPrefix: tj.tvoice
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.15.3
targets:
  TvoiceIOS:
    type: application
    platform: iOS
    sources:
      - path: TvoiceIOS
    info:
      path: TvoiceIOS/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        NSCameraUsageDescription: "Приложению Tvoice необходим доступ к камере для видеозвонков."
        NSMicrophoneUsageDescription: "Приложению Tvoice необходим доступ к микрофону для аудио- и видеозвонков."
    entitlements:
      path: TvoiceIOS/TvoiceIOS.entitlements
    dependencies:
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tj.tvoice.ios
        PRODUCT_NAME: Tvoice
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2N57GJQ6KC"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
  TvoiceIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TvoiceIOSTests
    dependencies:
      - target: TvoiceIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tj.tvoice.ios.tests
        SWIFT_VERSION: 5.10
        DEVELOPMENT_TEAM: "2N57GJQ6KC"
        CODE_SIGN_STYLE: Automatic
schemes:
  TvoiceIOS:
    build:
      targets:
        TvoiceIOS: all
        TvoiceIOSTests: [test]
    test:
      config: Debug
      targets:
        - name: TvoiceIOSTests
    run:
      config: Debug
    archive:
      config: Release
