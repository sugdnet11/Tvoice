services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  chat:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_KEY: ${ADMIN_KEY}
      FREEPBX_AUTH_URL: ${FREEPBX_AUTH_URL:-}
      FREEPBX_API_KEY: ${FREEPBX_API_KEY:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-}
      TVOICE_PUBLIC_MEETING_URL: ${TVOICE_PUBLIC_MEETING_URL:-}
      CONFERENCE_INVITE_TTL_HOURS: ${CONFERENCE_INVITE_TTL_HOURS:-168}
      CONFERENCE_GUEST_SESSION_TTL_MINUTES: ${CONFERENCE_GUEST_SESSION_TTL_MINUTES:-120}
      CONFERENCE_MAX_PARTICIPANTS: ${CONFERENCE_MAX_PARTICIPANTS:-16}
      CONFERENCE_MAX_GUESTS: ${CONFERENCE_MAX_GUESTS:-8}
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/data/attachments}
    volumes:
      - chat_attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CHAT_HOST: ${CHAT_HOST}
      PBX_HOST: ${PBX_HOST}
      VIDEO_HOST: ${VIDEO_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "443:443"
    volumes:
      - ${CADDYFILE:-./deploy/caddy/Caddyfile.test}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - chat
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  chat_attachments:
  caddy_data:
  caddy_config:
